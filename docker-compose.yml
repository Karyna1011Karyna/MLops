services:

  #  storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
      - ./scripts/init_mlflow_db.sh:/docker-entrypoint-initdb.d/02_init_mlflow_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # one-shot: create the buckets needed then exit
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DATASETS_BUCKET: ${MINIO_DATASETS_BUCKET}
      MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET}
      MLFLOW_ARTIFACTS_BUCKET: ${MLFLOW_ARTIFACTS_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_DATASETS_BUCKET} &&
      mc mb --ignore-existing local/$${MINIO_MODELS_BUCKET} &&
      mc mb --ignore-existing local/$${MLFLOW_ARTIFACTS_BUCKET}
      "

  # one-shot: publish data/seed_intent_dataset.csv as dataset version v0-seed
  dataset-init:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: tarotrag-api:latest
    command: ["python", "scripts/publish_seed_dataset.py"]
    env_file: .env
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # mlflow
  # Tracking server + model registry
  #Backend store = Postgres (a separate mlflow database created by scripts/init_mlflow_db.sh)
  #artifact in store = MinIO (bucket `mlflow-artifacts`, via the S3 API).
  mlflow:
    build:
      context: services/mlflow
    image: tarotrag-mlflow:latest
    env_file: .env
    command: >
      sh -c "mlflow server
      --backend-store-uri postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${MLFLOW_BACKEND_DB}
      --default-artifact-root s3://$${MLFLOW_ARTIFACTS_BUCKET}/
      --host 0.0.0.0 --port 5000"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # api
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: tarotrag-api:latest
    env_file: .env
    expose:
      - "8000"
    depends_on:
      dataset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      - api

  # - manual tooling
  # docker compose run --rm train
  train:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: tarotrag-api:latest
    command: ["python", "training/train_baseline.py", "--source", "minio", "--register"]
    env_file: .env
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  # docker compose run --rm promote-challenger
  promote-challenger:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: tarotrag-api:latest
    command: ["python", "scripts/promote_challenger.py"]
    env_file: .env
    profiles: ["tools"]
    depends_on:
      mlflow:
        condition: service_healthy

  # docker compose run --rm simulate-new-labels
  simulate-new-labels:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: tarotrag-api:latest
    command: ["python", "scripts/simulate_new_labels.py"]
    env_file: .env
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy

  #  airflow
  airflow:
    build:
      context: ./airflow
    image: tarotrag-airflow:latest
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DATASETS_BUCKET: ${MINIO_DATASETS_BUCKET}
      MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/dags/common
      - ./training:/opt/airflow/dags/training
      - ./data:/opt/airflow/dags/data
      - airflow_data:/opt/airflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  pg_data:
  minio_data:
  airflow_data:
